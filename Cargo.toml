[package]
name = "models-dev-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Typed, bounded models.dev catalog parser and asynchronous Rust client"
license = "MIT"
repository = "https://github.com/lib-x/models-dev-rs"
documentation = "https://docs.rs/models-dev-rs"
readme = "README.md"
keywords = ["models-dev", "llm", "catalog", "ai", "client"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
default = ["client"]
client = ["dep:reqwest", "dep:flate2", "dep:httpdate"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
httpdate = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[[example]]
name = "fetch"
required-features = ["client"]

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
